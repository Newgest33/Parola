# Publie la partie statique de Parola sur GitHub Pages à chaque push sur master.
# (Le tuteur IA a besoin d'un serveur : voir README, section Vercel.)
name: Déployer sur GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer les fichiers statiques
        run: |
          mkdir -p _site/src _site/img
          cp index.html style.css manifest.webmanifest sw.js icon.png _site/
          cp src/*.js _site/src/
          cp img/* _site/img/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
